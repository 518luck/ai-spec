# 生产环境编排
# 启动：docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# 构建：docker compose -f docker-compose.prod.yml --env-file .env.production build
#
# ! 所有密码与密钥从 .env.production 读取，不要硬编码进本文件
# ! Postgres/Redis/MinIO 端口默认不对宿主机暴露，仅 app-web 对外

name: ai-spec-prod

services:
  # ---------------------------------------------------------------------------
  # 应用：Next.js Web 主服务
  # ---------------------------------------------------------------------------
  app-web:
    image: ai-spec:latest
    container_name: ai-spec-prod-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./entrypoint.sh", "web"]
    env_file:
      - .env.production
    environment:
      # 容器内部访问同网络的服务，覆盖 .env 里的 localhost 地址
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-spec-net

  # ---------------------------------------------------------------------------
  # 应用：后台 Worker（广场扫描 / 翻译 / 队列消费）
  # ---------------------------------------------------------------------------
  # > 与 web 共用同一镜像，仅 entrypoint 不同；不对外暴露端口
  app-worker:
    image: ai-spec:latest
    container_name: ai-spec-prod-worker
    restart: unless-stopped
    command: ["./entrypoint.sh", "worker"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    # worker 等 web 完成数据库迁移后再启动，避免迁移与消费并发
    depends_on:
      app-web:
        condition: service_healthy
    networks:
      - ai-spec-net

  # ---------------------------------------------------------------------------
  # 基础设施：PostgreSQL 17
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: ai-spec-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 生产环境不暴露端口到宿主机；如需外部备份，临时注释打开
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-spec-net

  # ---------------------------------------------------------------------------
  # 基础设施：Redis（限流 + BullMQ 队列）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: ai-spec-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-spec-net

  # ---------------------------------------------------------------------------
  # 基础设施：MinIO（S3 兼容对象存储）
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-spec-prod-minio
    restart: unless-stopped
    # 控制台需要外部访问才开 9001；API 9000 仅容器内
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-spec-net

  # ---------------------------------------------------------------------------
  # 一次性任务：MinIO 启动后自动创建 bucket
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: ai-spec-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${S3_PUBLIC_BUCKET} || true;
      mc mb -p local/${S3_PRIVATE_BUCKET} || true;
      mc anonymous set download local/${S3_PUBLIC_BUCKET} || true;
      echo 'minio buckets ready';
      "
    networks:
      - ai-spec-net

networks:
  ai-spec-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
